<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrFab Studio — configurateur visuel</title>
<style>
:root{--bg:#0b1725;--panel:#111f2f;--line:#30465c;--text:#f2eee5;--muted:#aeb8c1;--gold:#d1a047;--silver:#c5c8c7}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:340px 1fr}.sidebar{background:#08131f;border-right:1px solid var(--line);overflow:auto;padding:18px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand h1{font-size:20px;margin:0}.brand span{font-size:11px;color:var(--gold);letter-spacing:1.2px;font-weight:700}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.toolbar button,.action{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:10px 12px;font-weight:650;cursor:pointer}.group{border:1px solid var(--line);background:var(--panel);border-radius:12px;margin:0 0 12px;overflow:hidden}.group summary{cursor:pointer;padding:13px 14px;font-weight:750;list-style:none}.controls{padding:0 14px 14px;display:grid;gap:12px}.control{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.control label{font-size:13px;color:#d4d9dd}.control input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--gold)}.control input[type=color]{width:46px;height:30px;border:1px solid var(--line);border-radius:6px;background:transparent;padding:2px}.control select{background:#0d1a28;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px}.value{font-size:12px;color:var(--gold)}.workspace{display:grid;grid-template-rows:54px 1fr;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;background:#0b1725;border-bottom:1px solid var(--line);padding:0 14px}.viewports{display:flex;gap:6px}.viewports button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:7px 10px;cursor:pointer}.viewports button.active{color:#101820;background:var(--gold);border-color:var(--gold)}.hint{font-size:12px;color:var(--muted)}.stage{overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:18px;background:#0e1b29}.frame-wrap{width:100%;height:calc(100vh - 90px);transition:width .2s}.frame-wrap.tablet{width:900px}.frame-wrap.mobile{width:430px}.frame-wrap iframe{width:100%;height:100%;border:1px solid #3a4f63;border-radius:10px;background:white}.footer-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.footer-actions .primary{background:var(--gold);color:#10243a;border-color:var(--gold)}.status{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.45}@media(max-width:900px){.app{grid-template-columns:320px 1fr}}
</style>
</head><body><div class="app"><aside class="sidebar">
<div class="brand"><div><span>ORFAB</span><h1>Studio visuel</h1></div><button class="action" id="resetBtn">Réinitialiser</button></div>
<div class="toolbar"><button data-jump="#accueil">Accueil</button><button data-jump="#constat">Constat</button><button data-jump="#methode">Méthode</button><button data-jump="#solution">Solution</button><button data-jump="#tarifs">Offres</button><button data-jump="#apropos">Footer</button></div>
<details class="group" open><summary>Couleurs principales</summary><div class="controls"><div class="control"><label>Bleu OrFab</label><input type="color" data-key="blue"></div><div class="control"><label>Or OrFab</label><input type="color" data-key="gold"></div><div class="control"><label>Silver</label><input type="color" data-key="silver"></div><div class="control"><label>Blanc cassé</label><input type="color" data-key="cream"></div><div class="control"><label>Noir bandeau</label><input type="color" data-key="headerBg"></div></div></details>
<details class="group" open><summary>Bandeau & navigation</summary><div class="controls"><div class="control"><label>Hauteur bandeau</label><span class="value" data-value="headerHeight"></span><input type="range" min="90" max="180" data-key="headerHeight"></div><div class="control"><label>Arrondi bandeau</label><span class="value" data-value="headerRadius"></span><input type="range" min="0" max="60" data-key="headerRadius"></div><div class="control"><label>Épaisseur contour or</label><span class="value" data-value="headerBorder"></span><input type="range" min="0" max="5" step="0.5" data-key="headerBorder"></div><div class="control"><label>Taille logo</label><span class="value" data-value="logoWidth"></span><input type="range" min="180" max="380" data-key="logoWidth"></div><div class="control"><label>Taille onglets</label><span class="value" data-value="navSize"></span><input type="range" min="12" max="28" data-key="navSize"></div><div class="control"><label>Graisse onglets</label><select data-key="navWeight"><option>500</option><option>650</option><option>700</option><option>750</option></select></div></div></details>
<details class="group" open><summary>Hero</summary><div class="controls"><div class="control"><label>Taille sur-titre</label><span class="value" data-value="heroKicker"></span><input type="range" min="10" max="24" data-key="heroKicker"></div><div class="control"><label>Taille grand titre</label><span class="value" data-value="heroTitle"></span><input type="range" min="42" max="92" data-key="heroTitle"></div><div class="control"><label>Largeur titre</label><span class="value" data-value="heroTitleWidth"></span><input type="range" min="700" max="1400" step="10" data-key="heroTitleWidth"></div><div class="control"><label>Largeur paragraphe</label><span class="value" data-value="heroLeadWidth"></span><input type="range" min="500" max="1200" step="10" data-key="heroLeadWidth"></div><div class="control"><label>Espace haut contenu</label><span class="value" data-value="heroTop"></span><input type="range" min="20" max="160" step="2" data-key="heroTop"></div><div class="control"><label>Taille bouton</label><span class="value" data-value="buttonSize"></span><input type="range" min="13" max="24" data-key="buttonSize"></div></div></details>
<details class="group" open><summary>Section « Constat »</summary><div class="controls"><div class="control"><label>Espace supérieur</label><span class="value" data-value="problemTop"></span><input type="range" min="20" max="160" step="2" data-key="problemTop"></div><div class="control"><label>Taille « LE CONSTAT »</label><span class="value" data-value="problemKicker"></span><input type="range" min="10" max="26" data-key="problemKicker"></div><div class="control"><label>Fond cartes</label><input type="color" data-key="cardBg"></div><div class="control"><label>Arrondi cartes</label><span class="value" data-value="cardRadius"></span><input type="range" min="0" max="30" data-key="cardRadius"></div><div class="control"><label>Espace avant cartes</label><span class="value" data-value="casesTop"></span><input type="range" min="20" max="100" step="2" data-key="casesTop"></div></div></details>
<details class="group"><summary>Sections suivantes</summary><div class="controls"><div class="control"><label>Fond méthode</label><input type="color" data-key="methodBg"></div><div class="control"><label>Fond solution</label><input type="color" data-key="solutionBg"></div><div class="control"><label>Fond offres</label><input type="color" data-key="offersBg"></div><div class="control"><label>Padding sections</label><span class="value" data-value="sectionPad"></span><input type="range" min="40" max="140" step="2" data-key="sectionPad"></div></div></details>
<div class="footer-actions"><button class="action primary" id="copyBtn">Copier la config</button><button class="action" id="downloadBtn">Télécharger JSON</button></div><div class="status"><strong>Important :</strong> les réglages sont sauvegardés dans ce navigateur et appliqués uniquement à l’aperçu.</div></aside>
<main class="workspace"><div class="topbar"><div class="viewports"><button class="active" data-view="desktop">Desktop</button><button data-view="tablet">Tablette</button><button data-view="mobile">Mobile</button></div><div class="hint">Aperçu en direct — réglages appliqués directement aux éléments</div></div><div class="stage"><div class="frame-wrap" id="frameWrap"><iframe id="preview" src="index.html?studio=3"></iframe></div></div></main></div>
<script>
const defaults={blue:'#10243a',gold:'#d1a047',silver:'#c5c8c7',cream:'#f2eee5',headerBg:'#050607',headerHeight:132,headerRadius:30,headerBorder:1.5,logoWidth:280,navSize:17,navWeight:650,heroKicker:14,heroTitle:70,heroTitleWidth:1080,heroLeadWidth:880,heroTop:92,buttonSize:16,problemTop:72,problemKicker:14,cardBg:'#d7d9d7',cardRadius:8,casesTop:54,methodBg:'#bec3c3',solutionBg:'#10243a',offersBg:'#d1a047',sectionPad:98};
const units={headerHeight:'px',headerRadius:'px',headerBorder:'px',logoWidth:'px',navSize:'px',heroKicker:'px',heroTitle:'px',heroTitleWidth:'px',heroLeadWidth:'px',heroTop:'px',buttonSize:'px',problemTop:'px',problemKicker:'px',cardRadius:'px',casesTop:'px',sectionPad:'px'};
let config={...defaults,...JSON.parse(localStorage.getItem('orfabStudioConfig')||'{}')};const frame=document.getElementById('preview');
function set(doc,selector,prop,value){doc.querySelectorAll(selector).forEach(el=>el.style.setProperty(prop,String(value),'important'))}
function apply(){localStorage.setItem('orfabStudioConfig',JSON.stringify(config));document.querySelectorAll('[data-value]').forEach(el=>{const k=el.dataset.value;el.textContent=config[k]+(units[k]||'')});const d=frame.contentDocument;if(!d||!d.body)return;
set(d,'body','background',config.blue);set(d,'header.of-header','height',config.headerHeight+'px');set(d,'header.of-header','background',config.headerBg);set(d,'header.of-header','border',config.headerBorder+'px solid '+config.gold);set(d,'header.of-header','border-radius',config.headerRadius+'px');set(d,'header.of-header .of-brand','width',config.logoWidth+'px');set(d,'header.of-header .of-nav','font-size',config.navSize+'px');set(d,'header.of-header .of-nav a','font-weight',config.navWeight);
set(d,'.of-hero','background',config.blue);set(d,'.of-hero__content > .of-kicker','font-size',config.heroKicker+'px');set(d,'.of-hero__content > .of-kicker','color',config.gold);set(d,'.of-hero h1','font-size',config.heroTitle+'px');set(d,'.of-hero h1','max-width',config.heroTitleWidth+'px');set(d,'.of-hero h1','color',config.cream);set(d,'.of-hero h1 span','color',config.gold);set(d,'.of-hero__lead','max-width',config.heroLeadWidth+'px');set(d,'.of-hero__content','padding-top',config.heroTop+'px');set(d,'.of-btn','font-size',config.buttonSize+'px');set(d,'.of-btn--gold','background',config.gold);
set(d,'.of-section:not(.of-problem)','padding-top',config.sectionPad+'px');set(d,'.of-section','padding-bottom',config.sectionPad+'px');
set(d,'.of-problem','background',config.gold);set(d,'.of-problem','padding-top',config.problemTop+'px');set(d,'.of-problem > .of-shell > .of-kicker','font-size',config.problemKicker+'px');set(d,'.of-problem .of-case','background',config.cardBg);set(d,'.of-problem .of-case','border-radius',config.cardRadius+'px');set(d,'.of-problem .of-cases','margin-top',config.casesTop+'px');set(d,'.of-method','background',config.methodBg);set(d,'.of-converge','background',config.solutionBg);set(d,'.of-offers','background',config.offersBg)}
function sync(){document.querySelectorAll('[data-key]').forEach(el=>{if(config[el.dataset.key]!==undefined)el.value=config[el.dataset.key]});apply()}
document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>{config[el.dataset.key]=el.type==='range'?Number(el.value):el.value;apply()}));frame.addEventListener('load',apply);
document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{const t=frame.contentDocument.querySelector(b.dataset.jump);if(t)t.scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('frameWrap').className='frame-wrap '+(b.dataset.view==='desktop'?'':b.dataset.view)});
document.getElementById('resetBtn').onclick=()=>{if(confirm('Réinitialiser tous les réglages ?')){config={...defaults};localStorage.removeItem('orfabStudioConfig');sync()}};document.getElementById('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(config,null,2));};document.getElementById('downloadBtn').onclick=()=>{const blob=new Blob([JSON.stringify(config,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='orfab-studio-config.json';a.click();URL.revokeObjectURL(a.href)};sync();
</script></body></html>
