</style></head><body><header class="header"><a class="brand" href="index.html#accueil"><img src="assets/orfab-logo-approved.webp" alt="OrFab"></a><nav class="nav"><a href="index.html#constat">Pourquoi OrFab</a><a href="index.html#methode">Notre méthode</a><a href="index.html#solution">La solution</a><a href="index.html#tarifs">Offres</a><a href="a-propos.html">À propos</a></nav><div class="header-actions"><a class="header-simulation" href="simulation.html?start=1#questions">Faire une simulation</a></div></header><main><section class="sim active" id="questions"><div class="shell grid"><div class="question"><div class="progress"><span id="bar"></span></div><div class="meta"><span id="step"></span><span>≈ 3 min</span></div><h2 id="title"></h2><p class="help" id="help"></p><div class="options" id="options"></div><div class="actions"><button class="back" id="back">← Retour</button><button class="btn" id="next" disabled>Continuer</button></div></div><aside class="map-card"><p class="kicker">VOTRE FONCTIONNEMENT AUJOURD’HUI</p><h2>Votre parcours prend forme.</h2><div class="legend"><span><i class="g"></i>manuel</span><span><i class="o"></i>optimisable / à relier</span><span><i class="b"></i>à conserver</span></div><div id="impact" class="impact"></div><div id="journey" class="journey"></div></aside></div></section><section class="result" id="result"><div class="shell result-layout"><aside class="map-card"><p class="kicker">VOTRE FONCTIONNEMENT AUJOURD’HUI</p><h2>Ce que vos réponses dessinent.</h2><div id="finalJourney" class="journey"></div></aside><div class="result-card"><p class="kicker">CE QU’ORFAB DÉTECTE</p><h2 id="resultTitle"></h2><p id="summary"></p><div class="diagnostics" id="diagnostics"></div><div class="actions"><button class="btn secondary" id="restart">Refaire la simulation</button></div></div></div></section></main><script>
const Q=[{id:'channels',t:'Par quels moyens vos prospects arrivent-ils ?',h:'Choisissez tous vos canaux, même secondaires.',multi:1,o:[['site','Site / formulaire'],['social','Instagram / Facebook'],['linkedin','LinkedIn'],['email','E-mail'],['phone','Téléphone'],['sms','SMS'],['whatsapp','WhatsApp'],['platform','Plateforme métier (CRM)'],['referral','Bouche-à-oreille']]},{id:'channelcentral',t:'Centralisez-vous les informations recueillies provenant de vos différents canaux ?',h:'Répondez selon votre fonctionnement réel aujourd’hui.',when:s=>s.channels?.length>1,o:[['yes','Oui'],['no','Non']]},{id:'centralwhere',t:'Où centralisez-vous ces informations ?',h:'Vous pouvez sélectionner plusieurs supports si nécessaire.',when:s=>s.channels?.length>1&&s.channelcentral==='yes',multi:1,o:[['paper','Carnet / papier'],['sheet','Tableur'],['phonenotes','Application de notes sur téléphone'],['pcnotes','Application de notes sur PC']]},{id:'centralmode',t:'Cette centralisation se fait-elle automatiquement ou manuellement ?',h:'Pensez au passage des informations depuis vos canaux vers le support central.',when:s=>s.channels?.length>1&&s.channelcentral==='yes'&&s.centralwhere?.length,o:[['manual','Manuellement'],['auto','Automatiquement']]},{id:'capture',t:'Où notez-vous les informations concernant un nouveau prospect ?',h:'Vous pouvez sélectionner plusieurs endroits.',when:s=>s.channels?.length===1||(s.channels?.length>1&&s.channelcentral==='no'),multi:1,o:[['memory','Nulle part / mémoire'],['notes','Notes ou carnet'],['sheet','Excel / Sheets'],['calendar','Agenda'],['crm','CRM / logiciel métier'],['auto','Création automatique']]},{id:'volume',t:'Combien de nouveaux prospects gérez-vous environ par mois ?',h:'Le volume change l’impact des actions répétées.',o:[['low','Moins de 5'],['mid','5 à 20'],['high','21 à 60'],['veryhigh','Plus de 60']]},{id:'services',t:'Combien de prestations différentes proposez-vous ?',h:'Cela permet de voir si le parcours doit se ramifier.',o:[['one','1'],['few','2 à 3'],['several','4 à 10'],['many','Plus de 10']]},{id:'sameflow',t:'Ces prestations suivent-elles le même parcours ?',h:'De la prise de contact jusqu’à la fin.',when:s=>s.services!=='one',o:[['yes','Oui, presque toujours'],['partly','En partie'],['no','Non, les parcours diffèrent']]},{id:'documents',t:'Quels documents échangez-vous avec vos prospects ou clients ?',h:'Ils restent autour du parcours.',multi:1,o:[['quote','Devis'],['contract','Contrat / CGV'],['form','Questionnaire / formulaire'],['proof','Pièces justificatives'],['invoice','Facture / acompte'],['work','Documents métier'],['none','Aucun document récurrent']]},{id:'docsflow',t:'Comment préparez-vous et envoyez-vous ces documents ?',h:'Pensez aux ressaisies.',when:s=>s.documents&&!s.documents.includes('none'),o:[['manual','Un par un, manuellement'],['template','Avec des modèles mais saisie manuelle'],['mixed','En partie automatisé'],['auto','Largement automatisé']]},{id:'tracking',t:'Comment savez-vous où en est chaque client ?',h:'Vous pouvez sélectionner plusieurs façons de suivre vos clients.',multi:1,o:[['memory','Je le sais de mémoire'],['scattered','Je vérifie dans plusieurs outils'],['list','Liste / tableur'],['crm','CRM / logiciel structuré'],['auto','Suivi structuré avec automatisations']]},{id:'repetition',t:'Quelles actions répétez-vous régulièrement ?',h:'Sélectionnez tout ce qui correspond.',multi:1,o:[['reply','Réponses / e-mails'],['reminder','Relances'],['appointment','Rappels de rendez-vous'],['docs','Préparation de documents'],['entry','Ressaisie d’informations'],['status','Mise à jour du suivi'],['none','Peu ou aucune']]},{id:'after',t:'Après une prestation, que se passe-t-il ?',h:'La fidélisation fait partie du parcours.',multi:1,o:[['review','Demande d’avis'],['thanks','Message de suivi'],['survey','Satisfaction'],['recall','Relance plus tard'],['offer','Nouvelle prestation'],['newsletter','Newsletter'],['nothing','Rien de particulier']]},{id:'newsletterfrequency',t:'Ce let state={},idx=0;const $=x=>document.getElementById(x);function visible(){return Q.filter(q=>!q.when||q.when(state))}function label(id,v){let q=Q.find(x=>x.id===id);if(Array.isArray(v))return v.map(x=>q.o.find(o=>o[0]===x)?.[1]||x);return q?.o.find(o=>o[0]===v)?.[1]||v}function renderQ(){let qs=visible();if(idx>=qs.length)idx=qs.length-1;let q=qs[idx];$('step').textContent=`Question ${idx+1} sur ${qs.length}`;$('bar').style.width=((idx+1)/qs.length*100)+'%';$('title').textContent=q.t;$('help').textContent=q.h;$('options').innerHTML='';q.o.forEach(o=>{let b=document.createElement('button');b.className='option';let sel=q.multi?(state[q.id]||[]).includes(o[0]):state[q.id]===o[0];if(sel)b.classList.add('selected');b.textContent=o[1];b.onclick=()=>{if(q.multi){let a=state[q.id]||[];if(o[0]==='none'||o[0]==='nothing')a=a.includes(o[0])?[]:[o[0]];else{a=a.filter(x=>x!=='none'&&x!=='nothing');a=a.includes(o[0])?a.filter(x=>x!==o[0]):[...a,o[0]]}state[q.id]=a}else state[q.id]=o[0];renderQ();renderJourney('journey')};$('options').appendChild(b)});$('next').disabled=!(q.multi?(state[q.id]||[]).length:state[q.id]);$('back').style.visibility=idx?'visible':'hidden'}
function stage(name){return `<div class="stage">${name}</div>`}function grouped(side,title,vals,kind='blue',sub=''){if(!vals||!vals.length)return'<div></div>';return`<div class="branch-stack ${side}" data-kind="${kind}"><div class="branch ${kind}"><div class="branch-label">${title}</div><ul>${vals.map(v=>`<li>${v}</li>`).join('')}</ul>${sub?`<small>${sub}</small>`:''}</div></div>`}function entryNode(){let n=state.channels?.length||0;return `<div class="branch-stack left" data-kind="blue"><div class="branch blue entry-node"><div class="entry-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 3.5h15.5v25H7z"/><path d="M10.5 6.5l8.5 2v17l-8.5 2z"/><path d="M16.7 17h.1"/><path d="M22.5 7H26v21.5H10"/></svg></div><div class="entry-title">Entrée(s)<br>Prospects</div><div class="entry-count">${n} ${n>1?'entrées':'entrée'}</div></div></div>`}function flowRow(left,center,right,line='manual'){return`<div class="flow-row" data-line="${line}">${left||'<div></div>'}${center}${right||'<div></div>'}</div>`}
function renderJourney(target){if(!state.channels){$(target).innerHTML='';return}let h='';h+=flowRow(entryNode(),stage('PROSPECT'),'','blue');let multi=state.channels.length>1;if(multi&&state.channelcentral)h+=flowRow(grouped('left','CENTRALISATION',state.channelcentral==='no'?['Informations non centralisées']:label('centralwhere',state.centralwhere||[]),state.centralmode==='auto'?'blue':'gold'),stage('PRISE DE CONTACT'),'','gold');else if(state.capture?.length)h+=flowRow('',stage('PRISE DE CONTACT'),grouped('right','ENREGISTREMENT',label('capture',state.capture),'gold'),'gold');if(state.volume)h+=flowRow(grouped('left','VOLUME MENSUEL',[label('volume',state.volume)],'gold'),stage('QUALIFICATION'),'','blue');if(state.services)h+=flowRow('',stage('PRESTATION(S)'),grouped('right','PRESTATIONS',[label('services',state.services)],state.sameflow==='yes'?'blue':'gold'),'blue');if(state.documents&&!state.documents.includes('none'))h+=flowRow(grouped('left','DOCUMENTS',label('documents',state.documents),state.docsflow==='auto'?'blue':'gold'),stage('DOCUMENTS'),'','blue');if(state.tracking?.length)h+=flowRow(grouped('left','SUIVI',label('tracking',state.tracking),'gold'),stage('CLIENT'),'','blue');if(state.repetition&&!state.repetition.includes('none'))h+=flowRow('',stage('ACTIONS RÉCURRENTES'),grouped('right','ACTIONS',label('repetition',state.repetition),'gold'),'gold');if(state.after)h+=flowRow(grouped('left','APRÈS PRESTATION',state.after.includes('nothing')?['Rien de particulier']:label('after',state.after),state.after.includes('nothing')?'gold':'blue'),stage('FIDÉLISATION'),'','blue');$(target).innerHTML=h;requestAnimationFrame(()=>drawConnectors(target))}
function colorFor(k){return k==='gold'?'#d1a047':k==='blue'?'#4f86aa':'#9ba3a8'}function svgEl(n,a){let e=document.createElementNS('http://www.w3.org/2000/svg',n);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e}function center(el,jr){let r=el.getBoundingClientRect();return{x:r.left-jr.left+r.width/2,y:r.top-jr.top+r.height/2,top:r.top-jr.top,bottom:r.bottom-jr.top,left:r.left-jr.left,right:r.right-jr.left}}function drawConnectors(target){let j=$(target);if(!j)return;j.querySelector('.journey-svg')?.remove();let svg=svgEl('svg',{class:'journey-svg'});j.prepend(svg);let jr=j.getBoundingClientRect(),rows=[...j.querySelectorAll('.flow-row')];rows.forEach((r,i)=>{let st=r.querySelector('.stage');if(!st)return;let sr=center(st,jr);[['left',r.querySelector('.branch-stack.left')],['right',r.querySelector('.branch-stack.right')]].forEach(([side,b])=>{if(!b)return;let br=center(b,jr),stroke=colorFor(b.dataset.kind||'manual'),x1=side==='left'?br.right:sr.right,x2=side==='left'?sr.left:br.left,mid=(x1+x2)/2;svg.appendChild(svgEl('path',{d:`M ${x1} ${br.y} H ${mid} V ${sr.y} H ${x2}`,fill:'none',stroke,'stroke-width':3,'stroke-linecap':'round','stroke-linejoin':'round'}))});let next=rows[i+1]?.querySelector('.stage');if(next){let nr=center(next,jr);svg.appendChild(svgEl('line',{x1:sr.x,y1:sr.bottom,x2:nr.x,y2:nr.top,stroke:colorFor(r.dataset.line||'manual'),'stroke-width':4,'stroke-linecap':'round'}))}});svg.setAttribute('viewBox',`0 0 ${j.scrollWidth} ${j.scrollHeight}`)}
function automaticToolCount(){return(state.channels?.length||0)+(state.capture?.length||0)+(state.centralwhere?.length||0)+(state.docsflow?1:0)+(state.tracking?.length||0)}function score(){let s={auto:0,docs:0,track:0,retain:0,complex:0,disp:0},c=state.capture||[],t=state.tracking||[];if(state.channels?.length>1&&state.channelcentral==='no')s.disp+=3;if(state.centralmode==='manual')s.auto+=2;if(c.some(x=>['memory','notes','sheet','calendar'].includes(x)))s.auto+=2;if(state.docsflow==='manual')s.docs+=3;else if(['template','mixed'].includes(state.docsflow))s.docs+=2;if(state.sameflow==='no')s.complex+=3;else if(state.sameflow==='partly')s.complex+=2;if(t.some(x=>['memory','scattered'].includes(x)))s.track+=3;else if(t.includes('list'))s.track++;if(state.repetition&&!state.repetition.includes('none'))s.auto+=state.repetition.length;if(state.after?.includes('nothing'))s.retain+=3;if(state.after?.includes('newsletter')&&state.newsletterfrequency==='list')s.retain+=2;let tools=automaticToolCount();if(tools>=6)s.disp+=3;else if(tools>=3)s.disp++;return s}function showResult(){renderJourney('finalJourney');let s=score(),e=[['automatisation',s.auto],['documents',s.docs],['suivi client',s.track],['fidélisation',s.retain],['parcours multiples',s.complex],['dispersion des outils',s.disp]].sort((a,b)=>b[1]-a[1]),total=e.reduce((a,x)=>a+x[1],0);$('resultTitle').innerHTML=total<4?'Votre organisation semble déjà cohérente.':`Votre principal levier semble être ${e[0][0]}.`;$('summary').textContent=total<4?'Votre fonctionnement semble déjà bien structuré.':`La carte montre surtout un enjeu de ${e[0][0]}, puis de ${e[1][0]}.`;$('diagnostics').innerHTML=e.filter(x=>x[1]>=2).map(x=>`<article class="diag"><strong>${x[0].toUpperCase()}</strong><p>Ce point ressort de vos réponses et mérite d’être étudié.</p></article>`).join('')||'<article class="diag"><strong>CONSERVER</strong><p>Rien ne justifie ici une reconstruction lourde.</p></article>';$('questions').classList.remove('active');$('result').classList.add('active')}
$('next').onclick=()=>{let qs=visible();if(idx<qs.length-1){idx++;renderQ()}else showResult()};$('back').onclick=()=>{if(idx){idx--;renderQ();renderJourney('journey')}};$('restart').onclick=()=>{state={};idx=0;$('result').classList.remove('active');$('questions').classList.add('active');renderQ();renderJourney('journey')};window.addEventListener('resize',()=>drawConnectors('journey'));renderQ();renderJourney('journey');</script></body></html>
