let state={},idx=0;const $=x=>document.getElementById(x);function visible(){return Q.filter(q=>!q.when||q.when(state))}function qOptions(q){return q.options?q.options(state):q.o}function label(id,v){let q=Q.find(x=>x.id===id),opts=q?qOptions(q):[];if(Array.isArray(v))return v.map(x=>opts.find(o=>o[0]===x)?.[1]||x);return opts.find(o=>o[0]===v)?.[1]||v}function clearAnswersFrom(id,includeCurrent=false){let pos=Q.findIndex(q=>q.id===id);if(pos<0)return;Q.slice(pos+(includeCurrent?0:1)).forEach(q=>delete state[q.id])}function renderQ(){let qs=visible();if(idx>=qs.length)idx=qs.length-1;let q=qs[idx],opts=qOptions(q);$('step').textContent=`Question ${idx+1} sur ${qs.length}`;$('bar').style.width=((idx+1)/qs.length*100)+'%';$('title').textContent=q.t;$('help').textContent=q.h;$('options').innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='option';let sel=q.multi?(state[q.id]||[]).includes(o[0]):state[q.id]===o[0];if(sel)b.classList.add('selected');b.textContent=o[1];b.onclick=()=>{clearAnswersFrom(q.id,false);if(q.multi){let a=state[q.id]||[];if(o[0]==='none'||o[0]==='nothing')a=a.includes(o[0])?[]:[o[0]];else{a=a.filter(x=>x!=='none'&&x!=='nothing');a=a.includes(o[0])?a.filter(x=>x!==o[0]):[...a,o[0]]}state[q.id]=a}else state[q.id]=o[0];renderQ();renderJourney('journey')};$('options').appendChild(b)});$('next').disabled=!(q.multi?(state[q.id]||[]).length:state[q.id]);$('back').style.visibility=idx?'visible':'hidden'}
const doorIcon=`<svg viewBox="0 0 32 32"><path d="M7 3.5h15.5v25H7z"/><path d="M10.5 6.5l8.5 2v17l-8.5 2z"/><path d="M16.7 17h.1"/><path d="M22.5 7H26v21.5H10"/></svg>`;const convergeIcon=`<svg viewBox="0 0 32 32"><path d="M4 7h5c5 0 7 6 12 9"/><path d="M4 16h17"/><path d="M4 25h5c5 0 7-6 12-9"/><circle cx="25.5" cy="16" r="2.7" fill="currentColor" stroke="none"/></svg>`;const braidIcon=`<svg viewBox="0 0 32 32"><path d="M4 7h5c5 0 7 7 12 7h7"/><path d="M4 16h5c5 0 7-9 12-9h7"/><path d="M4 25h5c5 0 7-7 12-7h7"/><path d="M25 4l3 3-3 3M25 11l3 3-3 3M25 15l3 3-3 3"/></svg>`;const contactIcon=`<svg viewBox="0 0 32 32"><rect x="5" y="5" width="22" height="22" rx="2"/><circle cx="12" cy="13" r="3"/><path d="M8 21c1.2-3 6.8-3 8 0"/><path d="M20 11h4M20 16h4M20 21h4"/></svg>`;const toolsIcon=`<svg viewBox="0 0 32 32"><rect x="5" y="6" width="13" height="17" rx="1"/><rect x="14" y="10" width="13" height="17" rx="1"/><path d="M8 10h7M8 14h7M17 14h7M17 18h7M17 22h7"/></svg>`;const peopleIcon=`<svg viewBox="0 0 32 32"><circle cx="16" cy="10" r="4"/><path d="M8 27c.6-6 3.5-10 8-10s7.4 4 8 10"/><path d="M6 20c-1.8.8-3 3.2-3.4 6M26 20c1.8.8 3 3.2 3.4 6"/></svg>`;const servicesIcon=`<svg viewBox="0 0 32 32"><rect x="5" y="5" width="9" height="9" rx="2"/><rect x="18" y="5" width="9" height="9" rx="2"/><rect x="5" y="18" width="9" height="9" rx="2"/><rect x="18" y="18" width="9" height="9" rx="2"/></svg>`;
function node(kind,icon,title,sub=''){return `<div class="journey-node ${kind}"><div class="node-icon">${icon}</div><div class="node-title">${title}</div>${sub?`<div class="node-sub">${sub}</div>`:''}</div>`}function toolNode(kind,tools,mode){return `<div class="journey-node ${kind}"><div class="node-icon">${toolsIcon}</div><div class="node-title">Recueil<br>des données</div><div class="node-sub">${tools} ${tools>1?'outils':'outil'}</div>${mode?`<div class="node-mode">${mode==='manual'?'Manuellement':'Automatiquement'}</div>`:''}</div>`}function captureNode(){let c=state.capture||[],memory=c.includes('memory'),auto=c.includes('auto'),crm=c.includes('crm'),manual=c.some(x=>['memory','notes','sheet','calendar'].includes(x)),supports=c.filter(x=>x!=='memory'&&x!=='auto').length;let mode=auto&&c.length===1?'Automatiquement':auto?'Mixte':crm&&!manual?'Structuré':'Manuellement';let kind=auto&&c.length===1||crm&&!manual?'blue':auto?'gold':'manual';let sub=memory&&c.length===1?'Mémoire / non enregistré':`${Math.max(supports,1)} ${Math.max(supports,1)>1?'supports':'support'}`;return `<div class="journey-node ${kind}"><div class="node-icon">${contactIcon}</div><div class="node-title">Enregistrement<br>du prospect</div><div class="node-sub">${sub}</div><div class="node-mode">${mode}</div></div>`}function arrow(kind='blue'){return `<div class="flow-arrow ${kind==='gold'?'gold':''}">→</div>`}function firstFlow(){let n=state.channels?.length||0,h=node('blue',doorIcon,'Entrée(s)<br>Prospects',`${n} ${n>1?'entrées':'entrée'}`);if(state.channels?.length>1&&state.channelcentral){let yes=state.channelcentral==='yes';h+=arrow(yes?'blue':'gold')+node(yes?'blue':'gold',yes?convergeIcon:braidIcon,yes?'Informations<br>centralisées':'Informations<br>dispersées',yes?'Convergence des infos prospect':'Plusieurs canaux séparés');if(yes&&state.centralwhere?.length){let tools=state.centralwhere.length;let modeKind=state.centralmode==='auto'?'blue':state.centralmode==='manual'?'gold':'blue';h+=arr function grouped(side,title,vals,kind='blue'){if(!vals||!vals.length)return'<div></div>';return`<div class="branch-stack ${side}"><div class="branch ${kind}"><div class="branch-label">${title}</div><ul>${vals.map(v=>`<li>${v}</li>`).join('')}</ul></div></div>`}function stage(name){return `<div class="stage">${name}</div>`}function flowRow(left,center,right){return `<div class="flow-row">${left||'<div></div>'}${center}${right||'<div></div>'}</div>`}function renderJourney(target){if(!state.channels){$(target).innerHTML='';return}let h=firstFlow(),legacy='';if(state.documents&&!state.documents.includes('none'))legacy+=flowRow(grouped('left','DOCUMENTS',label('documents',state.documents),state.docsflow==='auto'?'blue':'gold'),stage('DOCUMENTS'),'');if(state.tracking?.length)legacy+=flowRow(grouped('left','SUIVI',label('tracking',state.tracking),'gold'),stage('CLIENT'),'');if(state.repetition&&!state.repetition.includes('none'))legacy+=flowRow('',stage('ACTIONS RÉCURRENTES'),grouped('right','ACTIONS',label('repetition',state.repetition),'gold'));if(state.after)legacy+=flowRow(grouped('left','APRÈS PRESTATION',state.after.includes('nothing')?['Rien de particulier']:label('after',state.after),state.after.includes('nothing')?'gold':'blue'),stage('FIDÉLISATION'),'');$(target).innerHTML=h+(legacy?`<div class="legacy-tree">${legacy}</div>`:'')}
function automaticToolCount(){return(state.channels?.length||0)+(state.capture?.length||0)+(state.centralwhere?.length||0)+(state.docsflow?1:0)+(state.tracking?.length||0)}function score(){let s={auto:0,docs:0,track:0,retain:0,complex:0,disp:0},c=state.capture||[],t=state.tracking||[];if(state.channels?.length>1&&state.channelcentral==='no')s.disp+=3;if(state.centralmode==='manual')s.auto+=2;if(c.some(x=>['memory','notes','sheet','calendar'].includes(x)))s.auto+=2;if(state.docsflow==='manual')s.docs+=3;else if(['template','mixed'].includes(state.docsflow))s.docs+=2;let flows=state.services==='1'?1:state.sameflow==='more5'?6:Number(state.sameflow||1);if(flows>=4)s.complex+=3;else if(flows>=2)s.complex+=2;if(t.some(x=>['memory','scattered'].includes(x)))s.track+=3;else if(t.includes('list'))s.track++;if(state.repetition&&!state.repetition.includes('none'))s.auto+=state.repetition.length;if(state.after?.includes('nothing'))s.retain+=3;if(state.after?.includes('newsletter')&&state.newsletterfrequency==='list')s.retain+=2;let tools=automaticToolCount();if(tools>=6)s.disp+=3;else if(tools>=3)s.disp++;return s}function showResult(){renderJourney('finalJourney');let s=score(),e=[['automatisation',s.auto],['documents',s.docs],['suivi client',s.track],['fidélisation',s.retain],['parcours multiples',s.complex],['dispersion des outils',s.disp]].sort((a,b)=>b[1]-a[1]),total=e.reduce((a,x)=>a+x[1],0);$('resultTitle').textContent=total<4?'Votre organisation semble déjà cohérente.':`Votre principal levier semble être ${e[0][0]}.`;$('summary').textContent=total<4?'Votre fonctionnement semble déjà bien structuré.':`La carte montre surtout un enjeu de ${e[0][0]}, puis de ${e[1][0]}.`;$('diagnostics').innerHTML=e.filter(x=>x[1]>=2).map(x=>`<article class="diag"><strong>${x[0].toUpperCase()}</strong><p>Ce point ressort de vos réponses et mérite d’être étudié.</p></article>`).join('')||'<article class="diag"><strong>CONSERVER</strong><p>Rien ne justifie ici une reconstruction lourde.</p></article>';$('questions').classList.remove('active');$('result').classList.add('active')}
$('next').onclick=()=>{let qs=visible();if(idx<qs.length-1){idx++;renderQ()}else showResult()};$('back').onclick=()=>{if(idx){let qs=visible(),current=qs[idx];clearAnswersFrom(current.id,true);idx--;renderQ();renderJourney('journey')}};$('restart').onclick=()=>{state={};idx=0;$('result').classList.remove('active');$('questions').classList.add('active');renderQ();renderJourney('journey')};renderQ();renderJourney('journey');</script></body></html>
