name: Gold analysis block
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/gold-analysis-block.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/gold_analysis_block.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Ajoute un second bloc or pour l analyse"
          git push
