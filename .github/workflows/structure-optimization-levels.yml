name: Structure optimization levels
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/structure-optimization-levels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/structure_optimization_levels.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Structure les optimisations par priorité"
          git push
