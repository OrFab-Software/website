name: Show phase summary

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/show-phase-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visible phase summary
        run: python scripts/show_phase_summary.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Affiche les quatre cartes de synthèse dans le résultat"
          git push
