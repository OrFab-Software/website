name: Improve phase summary readability
on:
  push:
    branches: [main]
    paths:
      - scripts/improve_phase_summary_readability.py
      - .github/workflows/improve-phase-summary-readability.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/improve_phase_summary_readability.py
      - name: Commit result
        run: |
          if git diff --quiet -- simulation.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git commit -m "Améliore la lisibilité du récapitulatif de simulation"
          git push
