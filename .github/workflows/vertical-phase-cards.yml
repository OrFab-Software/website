name: Vertical phase cards

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/vertical-phase-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply vertical phase cards
        run: python scripts/vertical_phase_cards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Passe les cartes de phase en pleine largeur"
          git push
