name: Replace offer cards with CTA
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/replace-offer-cards-with-cta.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/replace_offer_cards_with_cta.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Remplace les cartes offres par un CTA visio"
          git push
