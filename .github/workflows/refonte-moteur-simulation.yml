name: Refonte moteur simulation

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/refonte-moteur-simulation.yml'

permissions:
  contents: write

jobs:
  refonte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild simulation result engine
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('simulation.html')
          s=p.read_text()
          s=s.replace("La simulation suit les quatre étapes de votre parcours pour faire ressortir les points déjà solides, les frictions et la complexité réelle du CRM à construire.","La simulation suit les quatre étapes de votre parcours pour faire ressortir ce qui fonctionne déjà, les points de friction et les améliorations réellement utiles.")

          start=s.index('function buildResult(){')
          end=s.index("$('diagnosticToggle').onclick=", start)
          new=r'''function usesCRM(){const pools=[state.remindertracking,state.tracking,state.centralwhere,state.tools];return pools.some(v=>Array.isArray(v)?v.includes('crm'):v==='crm')}
function buildResult(){
const channels=state.channels||[],rem=state.remindertracking||[],trans=state.transitionactions||[],rec=state.recurring||[],after=state.afterservice||[],docs=state.clientdocs||[],conversion=state.conversion||[];const journeyCount=serviceCount()<=1?1:Math.max(1,(state.serviceGroups||[]).length);const crm=usesCRM();let friction=0,complexity=0;const strengths=[],weaknesses=[],improvements=[];const strong=(text,why)=>strengths.push({text,why});const weak=(priority,text,why,improve)=>{weaknesses.push({priority,text,why});if(improve)improvements.push({priority,text:improve})};
if(channels.length>1){if(state.centralized==='yes'&&state.centralmode==='auto')strong('Vos demandes provenant de plusieurs canaux sont déjà regroupées automatiquement.','Vous conservez une vision cohérente des nouveaux contacts sans dépendre d’une ressaisie systématique.');else if(state.centralized==='yes')strong('Vos demandes sont déjà regroupées dans un même suivi.','Vous disposez d’un point de référence commun, ce qui limite la dispersion de l’information.');else{friction+=2;weak(92,'Les demandes arrivent par plusieurs canaux sans être réunies dans un suivi unique.','Une information peut rester dans un message, un e-mail ou un autre canal et ne pas être reprise au même endroit, ce qui rend le suivi plus fragile.','Regrouper les informations essentielles des nouvelles demandes dans un point de suivi commun.')}}else strong('Votre entrée prospect reste simple et lisible.','Avec peu de canaux à surveiller, le risque de dispersion des nouvelles demandes reste limité.');
if(state.centralmode==='manual'){friction++;weak(72,'La centralisation repose encore sur des actions manuelles.','Chaque report demande du temps et crée une possibilité d’écart entre la source d’origine et votre suivi.','Réduire les reports manuels au moment où une nouvelle demande arrive.')}
if(state.forgotreminder==='never')strong('Vos relances prospects sont globalement maîtrisées.','Vous savez retrouver les personnes à recontacter et le suivi ne semble pas dépendre d’oublis fréquents.');else if(state.forgotreminder==='sometimes'){friction+=2;weak(88,'Certaines relances peuvent être oubliées.','Quand plusieurs demandes avancent en parallèle, une relance manquée peut retarder une décision ou laisser une opportunité sans suite.','Sécuriser les prochaines actions et les relances importantes.')}else if(state.forgotreminder==='often'){friction+=3;weak(100,'Les relances reposent trop fortement sur votre vigilance.','Le système actuel ne protège pas suffisamment votre suivi lorsque la charge augmente ou que plusieurs dossiers avancent en même temps.','Mettre en place un suivi des prochaines actions avec rappels au bon moment.')}
if(rem.includes('memory')){friction++;weak(77,'Une partie du suivi des prospects repose sur la mémoire.','La mémoire fonctionne tant que le volume reste faible, mais elle devient moins fiable dès que plusieurs situations se chevauchent.','Donner à chaque demande une prochaine action clairement identifiable.')}
if(conversion.length===1)strong('Le passage de prospect à client repose sur un déclencheur clair.','Une règle de passage identifiable facilite le suivi et évite les ambiguïtés sur l’état d’un dossier.');else if(conversion.length>=3){complexity++;weak(74,'Le passage de prospect à client dépend de plusieurs déclencheurs.','Plus il existe de conditions possibles, plus il est facile que deux dossiers similaires soient traités différemment ou qu’une action soit oubliée.','Clarifier les déclencheurs et les actions associées au passage en client.')}
if(trans.includes('nothing')||trans.length<=2)strong('La transition vers le statut client reste relativement légère.','Peu d’actions doivent être coordonnées au même moment, ce qui limite la charge organisationnelle.');else if(trans.length>=4){complexity++;weak(79,'Le passage en client déclenche plusieurs actions.','Ces actions doivent rester cohérentes entre elles ; lorsqu’elles sont réalisées séparément, un oubli ou un décalage peut apparaître.','Coordonner les actions déclenchées lors du passage en client.')}
if(state.predocmode==='auto'||state.predocmode==='mixed')strong('Une partie de la préparation documentaire est déjà automatisée.','Vous avez déjà réduit des manipulations répétitives sur une étape qui revient souvent.');else if(state.predocmode==='manual'||state.predocmode==='template'){friction++;weak(69,'La préparation ou l’envoi de documents reste manuel.','Même avec des modèles, répéter les mêmes manipulations consomme du temps et peut créer des oublis lorsque plusieurs dossiers avancent en parallèle.','Préparer ou déclencher certains documents à partir de l’avancement du dossier.')}
if(journeyCount===1)strong('Votre activité suit un parcours principal clairement identifiable.','Une structure commune simplifie le suivi et permet d’améliorer le fonctionnement sans multiplier les règles particulières.');else{complexity+=journeyCount>=3?2:1;weak(95,`Votre activité comporte ${journeyCount} parcours distincts.`,`Chaque parcours peut demander des étapes, documents, rappels ou échéances différents ; les traiter exactement de la même manière risque donc de créer des contournements.`,`Structurer séparément les étapes réellement différentes de vos ${journeyCount} parcours, tout en conservant un socle commun.`)}
if(rec.length>=6){complexity++;friction++;weak(76,'De nombreuses actions reviennent pendant les prestations.','Plus les actions répétitives sont nombreuses, plus une part du temps est consacrée à l’organisation plutôt qu’à la prestation elle-même.','Identifier les actions récurrentes qui peuvent être préparées, rappelées ou déclenchées au bon moment.')}
if(state.reentry==='never')strong('Vous évitez déjà largement la double saisie.','Une information n’a pas besoin d’être reproduite dans plusieurs endroits, ce qui limite les erreurs et les pertes de temps.');else if(state.reentry==='sometimes'){friction+=2;weak(84,'Certaines informations sont ressaisies dans plusieurs outils.','La double saisie prend du temps et deux versions d’une même information peuvent finir par diverger.','Limiter les ressaisies entre les différentes étapes et vos outils existants.')}else if(state.reentry==='often'){friction+=3;weak(98,'La double saisie est fréquente.','Elle augmente directement le temps administratif et le risque d’erreur ou d’information non mise à jour.','Faire circuler les informations utiles entre les étapes et, lorsque c’est techniquement possible, entre vos outils.')}
if(state.ordered==='yes')strong('Vos prestations suivent un enchaînement identifiable.','Des étapes ordonnées rendent le fonctionnement prévisible et facilitent la sécurisation de ce qui doit arriver ensuite.');if(state.deadlines==='yes'){complexity++;weak(80,'Certaines étapes dépendent de dates ou de délais précis.','Une échéance qui reste isolée dans un agenda ou dans la mémoire peut être manquée alors qu’elle conditionne la suite du parcours.','Relier les échéances importantes aux étapes auxquelles elles se rapportent.')}
if(state.forgotdoc==='never'&&docs.length&&!docs.includes('none'))strong('Votre suivi documentaire est bien tenu.','Les documents nécessaires semblent être préparés et envoyés sans créer de friction majeure.');else if(state.forgotdoc==='sometimes'||state.forgotdoc==='often'){friction+=state.forgotdoc==='often'?2:1;weak(73,'Le suivi documentaire peut encore générer des oublis.','Un document manquant ou envoyé trop tard peut bloquer l’étape suivante et nécessiter une vérification supplémentaire.','Associer les documents importants aux bonnes étapes et aux bonnes échéances.')}
if(after.includes('nothing'))strong('Votre après-prestation reste volontairement simple.','Il n’est pas utile d’ajouter des mécanismes de fidélisation si votre activité n’en a pas réellement besoin.');if(state.reviewauto==='yes')strong('La demande d’avis est déjà automatisée.','Cette action ne dépend plus de votre mémoire et peut être réalisée de manière régulière.');if(state.recallplan==='auto')strong('Les relances après prestation sont déjà planifiées.','Le suivi dans le temps reste actif sans nécessiter une nouvelle décision à chaque client.');if(after.includes('recall')&&state.recallplan!=='auto'){friction++;weak(63,'Les relances après prestation doivent encore être planifiées manuellement.','Une action prévue plusieurs semaines ou mois plus tard est facile à perdre de vue sans mécanisme de rappel.','Planifier uniquement les suivis post-prestation qui ont une vraie valeur pour votre activité.')}if(after.includes('offer')&&(state.oldclients==='no'||state.oldclients==='sometimes')){friction++;weak(66,'Les anciens clients à recontacter ne sont pas toujours faciles à identifier.','Sans vue claire de l’historique, une opportunité de nouvelle prestation peut dépendre du hasard ou de la mémoire.','Rendre les anciens clients pertinents plus faciles à retrouver selon leur historique.')}
const sortedWeak=weaknesses.sort((a,b)=>b.priority-a.priority);const sortedImp=[...new Map(improvements.sort((a,b)=>b.priority-a.priority).map(x=>[x.text,x])).values()];const complexityScore=complexity+Math.floor(friction/2);const advancedEligible=complexityScore>=3||journeyCount>=2||rec.length>=6||(state.ordered==='yes'&&state.deadlines==='yes');
let process=[];process.push(channels.length>1?`Vos prospects peuvent entrer par ${channels.length} canaux différents.`:'Vos prospects arrivent principalement par un canal d’entrée.');if(conversion.length)process.push(conversion.length===1?'Le passage en client repose ensuite sur un déclencheur principal.':`Le passage en client peut dépendre de ${conversion.length} déclencheurs différents.`);process.push(journeyCount===1?'Une fois le client engagé, votre activité suit principalement un même parcours.':`Une fois le client engagé, votre activité se répartit en ${journeyCount} parcours distincts.`);if(state.deadlines==='yes')process.push('Certaines étapes sont liées à des échéances précises.');if(after.includes('nothing'))process.push('Après la prestation, votre suivi reste volontairement limité.');else if(after.length)process.push('Après la prestation, plusieurs actions de suivi ou de fidélisation peuvent encore intervenir.');
return{crm,process:process.join(' '),strengths:strengths.slice(0,4),weaknesses:sortedWeak.slice(0,4),improvements:sortedImp.slice(0,4).map(x=>x.text),advancedEligible};}
function diagnosticTreeData(){const r=buildResult();const byPhase=[{title:'Parcours prospect',keys:['demandes','relances','mémoire','centralisation']},{title:'Qualification en client',keys:['passage','déclencheur','documents']},{title:'Parcours client',keys:['parcours','saisie','échéance','prestations','actions']},{title:'Après la prestation',keys:['après','anciens clients','avis']}];return byPhase.map(p=>({title:p.title,good:r.strengths.filter(x=>p.keys.some(k=>(x.text+' '+x.why).toLowerCase().includes(k))),bad:r.weaknesses.filter(x=>p.keys.some(k=>(x.text+' '+x.why).toLowerCase().includes(k)))}))}
function renderDiagnosticTree(){const tree=$('diagnosticTree');tree.innerHTML=diagnosticTreeData().map(n=>`<article class="diagnostic-node"><h3>${n.title}</h3>${n.good.length?n.good.map(x=>`<p><strong>Point fort :</strong> ${x.text}<br><span>${x.why}</span></p>`).join(''):'<p class="diagnostic-empty">Aucun point fort particulier détecté sur cette étape.</p>'}${n.bad.length?n.bad.map(x=>`<p><strong>Point faible :</strong> ${x.text}<br><span>${x.why}</span></p>`).join(''):'<p class="diagnostic-empty">Aucun point faible majeur détecté sur cette étape.</p>'}</article>`).join('')}
function showResult(){const r=buildResult();$('resultProfileTitle').textContent='Analyse de votre simulation';$('resultProfileText').textContent=r.process;const strengthText=r.strengths.length?r.strengths.map(x=>`<strong>${x.text}</strong> ${x.why}`).join(' '):'Votre fonctionnement ne présente pas encore de point fort suffisamment net pour être isolé, mais il reste lisible et peut être amélioré sans tout reconstruire.';const weaknessText=r.weaknesses.length?r.weaknesses.map(x=>`<strong>${x.text}</strong> ${x.why}`).join(' '):'Aucun point faible majeur ne ressort de vos réponses : l’enjeu est surtout de conserver ce qui fonctionne déjà.';$('resultNarrative').innerHTML=`<strong>Ce qui fonctionne déjà.</strong> ${strengthText}<br><br><strong>Les points à surveiller.</strong> ${weaknessText}`;const axes=r.improvements.length?r.improvements.map((x,i)=>`${i+1}. ${x}`).join(' '):'Conserver votre organisation actuelle et n’ajouter que les sécurités réellement utiles.';$('resultSolution').innerHTML=`<strong>Axes d’amélioration possibles.</strong> ${axes}`;if(r.advancedEligible){$('resultOfferText').innerHTML=`En choisissant de traiter uniquement les frictions prioritaires et de garder une optimisation mesurée du workflow, le périmètre peut rester autour d’<strong class="offer-inline">ESSENTIEL+</strong>. Si vous souhaitez aller plus loin — davantage d’orchestration entre les parcours, d’automatismes et de sécurisation des étapes — le projet peut évoluer vers <strong class="offer-inline">SIGNATURE</strong>. L’objectif est de choisir le niveau d’optimisation qui a réellement du sens pour votre activité, pas d’ajouter de la complexité pour elle-même.`}else{$('resultOfferText').innerHTML=`Au vu de votre fonctionnement, une optimisation ciblée semble suffisante. Le périmètre se rapproche d’<strong class="offer-inline">ESSENTIEL+</strong> : corriger les principales frictions sans transformer inutilement ce qui fonctionne déjà. Aller jusqu’à Signature ne paraît pas justifié à ce stade.`}const crmNote=r.crm?' Votre utilisation actuelle d’un CRM pourra naturellement être prise en compte dans cette réflexion.':'';$('offerNote').textContent='Cette orientation reste indicative. Le périmètre final dépendra des améliorations que vous choisirez réellement de retenir et des outils à connecter.'+crmNote;renderDiagnosticTree();$('diagnosticDetail').hidden=true;$('diagnosticToggle').setAttribute('aria-expanded','false');$('questions').classList.remove('active');$('result').classList.add('active');window.scrollTo({top:0,behavior:'smooth'});saveDebugSession()}
'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Reoriente la simulation vers le diagnostic du fonctionnement"
          git push
