name: Add simulation save form
on:
  push:
    branches: [main]
    paths:
      - scripts/add_simulation_save_form.py
      - scripts/fix_simulation_submission_id.py
      - .github/workflows/add-simulation-save-form.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/add_simulation_save_form.py
      - run: python scripts/fix_simulation_submission_id.py
      - name: Commit result
        run: |
          if git diff --quiet -- simulation.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git commit -m "Corrige l’identifiant unique des simulations"
          git push
