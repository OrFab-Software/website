name: Simplify result heading
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/simplify-result-heading.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/simplify_result_heading.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Simplifie le titre du résultat de simulation"
          git push
