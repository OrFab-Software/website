name: Run refonte moteur

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/run-refonte-moteur.yml'

permissions:
  contents: write

jobs:
  refonte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refonte
        run: python scripts/refonte_moteur_simulation.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Reoriente la simulation vers le diagnostic du fonctionnement"
          git push
