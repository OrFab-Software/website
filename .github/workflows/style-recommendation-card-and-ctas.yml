name: Style recommendation card and CTAs
on:
  push:
    branches: [main]
    paths:
      - scripts/style_recommendation_card_and_ctas.py
      - .github/workflows/style-recommendation-card-and-ctas.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/style_recommendation_card_and_ctas.py
      - name: Commit result
        run: |
          if git diff --quiet -- simulation.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git commit -m "Ajoute la recommandation tarifaire et renforce les CTA"
          git push
