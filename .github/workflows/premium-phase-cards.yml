name: Premium phase cards
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/premium-phase-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/premium_phase_cards.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Applique le style OrFab or argent aux phases"
          git push
