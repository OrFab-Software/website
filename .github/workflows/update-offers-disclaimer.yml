name: Update offers disclaimer
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/update-offers-disclaimer.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_offers_disclaimer.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Clarifie la cartographie et les tarifs indicatifs"
          git push
