name: Fix analysis runtime
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-analysis-runtime.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_analysis_runtime.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Corrige le rendu dynamique du bloc analyse"
          git push
