name: Patch fluid simulation results

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-results-fluid.yml'
      - 'scripts/patch_results_fluid.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply result page patch
        run: python scripts/patch_results_fluid.py
      - name: Commit changes
        run: |
          git config user.name "OrFab Automation"
          git config user.email "actions@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Fluidifie la page de résultats et ajoute le diagnostic dépliable"
          git push
