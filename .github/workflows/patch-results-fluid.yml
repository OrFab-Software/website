name: Patch fluid simulation results

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-results-fluid.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch simulation result page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('simulation.html')
          s=p.read_text()

          old_css='.result-layout{display:grid;grid-template-columns:minmax(300px,.75fr) minmax(0,1.25fr);gap:28px;align-items:start}.result-card{background:var(--silver);color:var(--blue);padding:38px}.result-card>h2{font-size:clamp(32px,4vw,48px);line-height:1.05;margin:0 0 14px}.result-intro{font-size:17px;line-height:1.55;color:#29445c}.result-section{margin-top:28px;padding-top:24px;border-top:1px solid rgba(16,36,58,.2)}.result-section h3{font-size:25px;margin:0 0 12px}.result-section p{line-height:1.6;margin:0}.result-list{display:block;margin-top:8px}.result-item{line-height:1.65;margin:0 0 8px}.offer-box{margin-top:28px;padding-top:24px;border-top:1px solid rgba(16,36,58,.2)}.offer-box h3{font-size:25px;margin:0 0 8px}.offer-name{color:#9b6c18;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:30px;line-height:1.1;margin:0 0 10px!important}.offer-box p{line-height:1.6;margin:0}.offer-note{margin-top:12px!important;color:#29445c;font-size:13px}.result-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.result-actions .secondary{background:transparent;border:1px solid var(--blue);color:var(--blue)}.result-actions a{display:inline-flex;align-items:center;text-decoration:none}.result-actions .booking{background:linear-gradient(180deg,#f3ce77,#d59c35);color:#090a0c}.result-actions .booking[aria-disabled="true"]{opacity:.55;cursor:not-allowed}'
          new_css='.result-layout{display:block}.result-card{width:100%;background:var(--cream);color:var(--blue);padding:52px 56px}.result-card>h2{font-size:clamp(38px,5vw,62px);line-height:1.02;margin:0 0 18px;max-width:980px}.result-lead{font-size:18px;line-height:1.65;color:#29445c;max-width:1080px;margin:0}.result-flow{max-width:1120px;margin-top:30px;padding-top:28px;border-top:1px solid rgba(16,36,58,.16)}.result-flow p{font-size:17px;line-height:1.75;margin:0 0 22px}.offer-inline{color:#9b6c18;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:1.28em;font-weight:600}.offer-note{color:#50677a!important;font-size:14px!important}.result-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:30px}.result-actions .secondary{background:transparent;border:1px solid var(--blue);color:var(--blue)}.result-actions a{display:inline-flex;align-items:center;text-decoration:none}.result-actions .booking{background:linear-gradient(180deg,#f3ce77,#d59c35);color:#090a0c}.result-actions .booking[aria-disabled="true"]{opacity:.55;cursor:not-allowed}.diagnostic-toggle{margin-left:auto;border:0;background:transparent;color:#29445c;padding:10px 2px;font-weight:750;cursor:pointer;display:inline-flex;align-items:center;gap:9px}.diagnostic-toggle::after{content:"⌄";font-size:17px;transition:transform .2s ease}.diagnostic-toggle[aria-expanded="true"]::after{transform:rotate(180deg)}.diagnostic-detail{margin-top:26px;padding-top:24px;border-top:1px solid rgba(16,36,58,.16)}.diagnostic-detail[hidden]{display:none}.diagnostic-tree{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.diagnostic-node{border:1px solid rgba(16,36,58,.15);border-radius:16px;padding:18px;background:rgba(190,195,195,.18)}.diagnostic-node h3{font-size:19px;margin:0 0 12px}.diagnostic-node p{font-size:13px;line-height:1.5;margin:8px 0}.diagnostic-node strong{color:#9b6c18}.diagnostic-empty{color:#667989}'
          if old_css not in s: raise SystemExit('CSS target not found')
          s=s.replace(old_css,new_css,1)

          old_html='<section class="result" id="result"><div class="shell result-layout"><aside class="map-card"><p class="kicker">VOTRE FONCTIONNEMENT AUJOURD’HUI</p><h2 id="resultProfileTitle">Votre fonctionnement a été analysé.</h2><p class="map-note" id="resultProfileText"></p><div class="phase-list" id="finalPhaseList"></div></aside><div class="result-card"><p class="kicker">VOTRE SIMULATION</p><h2 id="resultHeadline">Ce que votre fonctionnement fait ressortir.</h2><p class="result-intro" id="resultIntro"></p><div id="strengthsSection" class="result-section"><h3>Ce qui fonctionne déjà bien</h3><div class="result-list" id="strengths"></div></div><div id="diagnosticsSection" class="result-section"><h3>Les principaux points à simplifier</h3><div class="result-list" id="diagnostics"></div></div><div id="opportunitiesSection" class="result-section"><h3>Ce qu’on pourrait mettre en place</h3><div class="result-list" id="opportunities"></div></div><div class="offer-box"><h3>Le périmètre qui semble vous correspondre</h3><p class="offer-name" id="offerName"></p><p id="offerText"></p><p class="offer-note" id="offerNote"></p></div><div class="result-actions"><a class="btn booking" id="bookingLink" href="#" aria-disabled="true" title="Lien de réservation Google Calendar à configurer">Réserver un échange visio</a><a class="btn secondary" href="index.html#tarifs">Voir les offres</a><button class="btn" id="restart">Refaire la simulation</button></div></div></div></section>'
          new_html='<section class="result" id="result"><div class="shell result-layout"><div class="result-card"><p class="kicker">VOTRE SIMULATION</p><h2 id="resultProfileTitle">Votre fonctionnement a été analysé.</h2><p class="result-lead" id="resultProfileText"></p><div class="result-flow"><p id="resultNarrative"></p><p id="resultSolution"></p><p id="resultOfferText"></p><p class="offer-note" id="offerNote"></p></div><div class="result-actions"><a class="btn booking" id="bookingLink" href="#" aria-disabled="true" title="Lien de réservation Google Calendar à configurer">Réserver un échange visio</a><a class="btn secondary" href="index.html#tarifs">Voir les offres</a><button class="btn" id="restart">Refaire la simulation</button><button class="diagnostic-toggle" id="diagnosticToggle" type="button" aria-expanded="false">Voir le détail de mon diagnostic</button></div><div class="diagnostic-detail" id="diagnosticDetail" hidden><div class="diagnostic-tree" id="diagnosticTree"></div></div></div></div></section>'
          if old_html not in s: raise SystemExit('HTML target not found')
          s=s.replace(old_html,new_html,1)

          old_show='function showResult(){const r=buildResult();renderPhases(\'finalPhaseList\',0);$(\'resultProfileTitle\').textContent=r.profile;$(\'resultProfileText\').textContent=r.profileText;$(\'resultIntro\').textContent=`Le questionnaire fait ressortir un niveau de friction ${r.frictionLevel} et une complexité de construction ${r.buildComplexity}. L’objectif n’est pas de tout remplacer, mais de travailler sur les endroits où un CRM sur mesure apporterait réellement quelque chose.`;const fill=(id,items)=>{$(id).innerHTML=items.map(x=>`<div class="result-item">${x}</div>`).join(\'\')};fill(\'strengths\',r.strengths);fill(\'diagnostics\',r.diagnostics.length?r.diagnostics:[\'Aucune friction majeure ne ressort de vos réponses.\']);fill(\'opportunities\',r.opportunities.length?r.opportunities:[\'Conserver votre fonctionnement actuel et n’ajouter que les éléments réellement utiles.\']);$(\'offerName\').textContent=r.offer;$(\'offerText\').textContent=r.borderline?`Votre besoin se situe probablement autour de ${r.offer}. Certains éléments pourraient toutefois faire évoluer le périmètre vers ${r.borderline}.`:`Votre fonctionnement se rapproche ${r.confidence===\'forte\'?\'clairement\':\'probablement\'} du périmètre ${r.offer}.`;$(\'offerNote\').textContent=\'Cette estimation reste indicative : un échange permet de confirmer les automatisations utiles, les outils à connecter et le périmètre exact avant tout devis.\';$(\'questions\').classList.remove(\'active\');$(\'result\').classList.add(\'active\');window.scrollTo({top:0,behavior:\'smooth\'});saveDebugSession()}'
          new_show='function diagnosticTreeData(){const ch=state.channels||[],rem=state.remindertracking||[],tr=state.transitionactions||[],rec=state.recurring||[],after=state.afterservice||[];const journeyCount=serviceCount()<=1?1:Math.max(1,(state.serviceGroups||[]).length);return[{title:\'Parcours prospect\',good:[state.centralmode===\'auto\'?\'Entrées déjà centralisées automatiquement\':null,state.forgotreminder===\'never\'?\'Relances globalement maîtrisées\':null].filter(Boolean),bad:[state.centralized===\'no\'?\'Informations dispersées entre plusieurs canaux\':null,state.centralmode===\'manual\'?\'Centralisation encore manuelle\':null,state.forgotreminder===\'often\'||state.forgotreminder===\'sometimes\'?\'Risque d’oubli dans les relances\':null].filter(Boolean)},{title:\'Qualification en client\',good:[state.predocmode===\'auto\'||state.predocmode===\'mixed\'?\'Documents déjà partiellement automatisés\':null].filter(Boolean),bad:[(state.conversion||[]).length>=3?\'Plusieurs déclencheurs à coordonner\':null,state.predocmode===\'manual\'||state.predocmode===\'template\'?\'Préparation documentaire encore manuelle\':null,tr.length>=4&&!tr.includes(\'nothing\')?\'Plusieurs actions au passage en client\':null].filter(Boolean)},{title:\'Parcours client\',good:[journeyCount===1?\'Un parcours principal clairement identifiable\':null,state.reentry===\'never\'?\'Peu de double saisie\':null,state.forgotdoc===\'never\'?\'Suivi documentaire bien tenu\':null].filter(Boolean),bad:[journeyCount>=2?`${journeyCount} parcours distincts à gérer`:null,rec.length>=6?\'Beaucoup d’actions récurrentes\':null,state.reentry===\'often\'||state.reentry===\'sometimes\'?\'Ressaisie entre plusieurs outils\':null,state.ordered===\'yes\'&&state.deadlines===\'yes\'?\'Étapes et échéances à orchestrer\':null].filter(Boolean)},{title:\'Après la prestation\',good:[state.reviewauto===\'yes\'?\'Demande d’avis déjà automatisée\':null,state.recallplan===\'auto\'?\'Relances post-prestation déjà planifiées\':null,state.oldclients===\'yes\'?\'Anciens clients faciles à identifier\':null,after.includes(\'nothing\')?\'Pas de suivi complexe nécessaire\':null].filter(Boolean),bad:[after.includes(\'recall\')&&state.recallplan!==\'auto\'?\'Relances post-prestation encore manuelles\':null,after.includes(\'offer\')&&(state.oldclients===\'no\'||state.oldclients===\'sometimes\')?\'Réactivation des anciens clients peu structurée\':null].filter(Boolean)}]};function renderDiagnosticTree(){const tree=$(\'diagnosticTree\');tree.innerHTML=diagnosticTreeData().map(n=>`<article class="diagnostic-node"><h3>${n.title}</h3>${n.good.length?n.good.map(x=>`<p><strong>Point fort :</strong> ${x}</p>`).join(\'\'):\'<p class="diagnostic-empty">Aucun point fort particulier détecté.</p>\'}${n.bad.length?n.bad.map(x=>`<p><strong>Point faible :</strong> ${x}</p>`).join(\'\'):\'<p class="diagnostic-empty">Aucun point faible majeur détecté.</p>\'}</article>`).join(\'\')}function showResult(){const r=buildResult();$(\'resultProfileTitle\').textContent=r.profile.endsWith(\'.\')?r.profile:r.profile+\'.\';$(\'resultProfileText\').textContent=r.profileText;const diag=r.diagnostics.length?r.diagnostics.join(\' \'):\'Aucune friction majeure ne ressort de vos réponses.\';const opp=r.opportunities.length?r.opportunities.join(\' \'):\'On conserverait donc votre fonctionnement actuel en n’ajoutant que les éléments réellement utiles.\';$(\'resultNarrative\').textContent=`Votre simulation fait ressortir un niveau de friction ${r.frictionLevel} et une complexité de construction ${r.buildComplexity}. ${diag} L’objectif n’est pas de tout remplacer, mais de simplifier ce qui prend du temps et de sécuriser les étapes importantes.`;$(\'resultSolution\').textContent=`Concrètement, ${opp.charAt(0).toLowerCase()+opp.slice(1)}`;$(\'resultOfferText\').innerHTML=r.borderline?`À ce stade, votre besoin se situe probablement autour du périmètre <strong class="offer-inline">${r.offer}</strong>, avec certains éléments susceptibles de le faire évoluer vers ${r.borderline}.`:`À ce stade, votre besoin se rapproche ${r.confidence===\'forte\'?\'clairement\':\'probablement\'} du périmètre <strong class="offer-inline">${r.offer}</strong>.`;$(\'offerNote\').textContent=\'Cette orientation reste indicative. Le prix final dépendra de la cartographie précise de votre fonctionnement, des automatisations réellement utiles et des outils à connecter.\';renderDiagnosticTree();$(\'diagnosticDetail\').hidden=true;$(\'diagnosticToggle\').setAttribute(\'aria-expanded\',\'false\');$(\'questions\').classList.remove(\'active\');$(\'result\').classList.add(\'active\');window.scrollTo({top:0,behavior:\'smooth\'});saveDebugSession()}'
          if old_show not in s: raise SystemExit('showResult target not found')
          s=s.replace(old_show,new_show,1)

          marker="$('next').onclick=()=>{let vs=visibleScreens();"
          toggle="$('diagnosticToggle').onclick=()=>{const panel=$('diagnosticDetail');const open=panel.hidden;panel.hidden=!open;$('diagnosticToggle').setAttribute('aria-expanded',String(open));$('diagnosticToggle').textContent=open?'Masquer le détail de mon diagnostic':'Voir le détail de mon diagnostic'};"
          if marker not in s: raise SystemExit('event marker not found')
          s=s.replace(marker,toggle+marker,1)

          s=s.replace('@media(max-width:1100px){.grid,.result-layout{grid-template-columns:1fr}.map-card{position:relative;top:auto}}','@media(max-width:1100px){.grid{grid-template-columns:1fr}.map-card{position:relative;top:auto}.diagnostic-tree{grid-template-columns:repeat(2,minmax(0,1fr))}}',1)
          s=s.replace('@media(max-width:600px){.question,.map-card,.result-card{padding:22px}','@media(max-width:600px){.question,.map-card,.result-card{padding:22px}.diagnostic-tree{grid-template-columns:1fr}.diagnostic-toggle{width:100%;margin-left:0;justify-content:flex-start}',1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "OrFab Automation"
          git config user.email "actions@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Fluidifie la page de résultats et ajoute le diagnostic dépliable"
          git push
