name: Refine offer matrix
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/refine-offer-matrix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/refine_offer_matrix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Affine la couverture réelle des offres"
          git push
