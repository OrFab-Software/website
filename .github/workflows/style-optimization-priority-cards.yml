name: Style optimization priority cards
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/style-optimization-priority-cards.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/style_optimization_priority_cards.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Style les cartes de priorité en argent bordé de bleu"
          git push
