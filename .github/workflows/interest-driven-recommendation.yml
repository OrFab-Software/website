name: Interest driven recommendation
on:
  push:
    branches: [main]
    paths:
      - scripts/interest_driven_recommendation.py
      - .github/workflows/interest-driven-recommendation.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/interest_driven_recommendation.py
      - name: Commit result
        run: |
          if git diff --quiet -- simulation.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git commit -m "Affiche la recommandation selon les intérêts sélectionnés"
          git push
