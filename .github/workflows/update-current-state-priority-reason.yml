name: Update current state priority reason
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/update-current-state-priority-reason.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_current_state_priority_reason.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Centre la raison de priorité sur la situation actuelle"
          git push
