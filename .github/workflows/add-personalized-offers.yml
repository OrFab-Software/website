name: Add personalized offers
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/add-personalized-offers.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/add_personalized_offers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation.html
          git diff --cached --quiet || git commit -m "Ajoute les offres adéquates personnalisées"
          git push
